<!DOCTYPE html>
<html lang="es">

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>The NY Times - Noticias</title>
<style>
	:root {
		--background-image: url("https://thumbs.dreamstime.com/b/paisajes-de-yosemite-46208063.jpg");
	}

	body {
		font-family: 'Times New Roman', serif;
		background-color: #f9f9f9;
		margin: 0;
		padding: 0;
		color: #121212;
	}

	span {
		font-family: 'Times New Roman', serif;
	}

	.menuxd {
		background-color: rgba(36, 34, 34, 0.158);
		backdrop-filter: blur(5px);
		position: relative;
		border-radius: 8px;
		top: 0;
		left: 0;
		width: 100%;
		box-sizing: border-box;
		z-index: 1000;
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 10px 20px;
		border-bottom: 2px solid #121212;
	}

	.logo {
		font-size: 35px;
		font-weight: bold;
		color: black;
		text-decoration: none;
		line-height: 80px;
	}

	.p {
		text-align: left;
		font-size: 16px;
		margin: 0;
	}

	.buttnon {
		background-color: rgba(51, 51, 51, 0.03);
		backdrop-filter: blur(5px);
		border-radius: 8px;
		border: 1px solid rgba(0, 0, 0, 0.1);
		color: #333333;
		cursor: pointer;
		display: inline-block;
		font-family: "Haas Grot Text R Web", "Helvetica Neue", Helvetica, Arial, sans-serif;
		font-size: 14px;
		font-weight: 500;
		line-height: 20px;
		margin: 0;
		padding: 10px 12px;
		text-align: center;
		transition: all 200ms;
		user-select: none;
		-webkit-user-select: none;
		touch-action: manipulation;
		text-decoration: none;
	}

	.buttnon:hover {
		background-color: rgba(0, 0, 0, 0.1);
	}

	.trapecio {
		display: flex;
		justify-content: flex-end;
		align-items: center;
	}

	.dospuntosuve {
		display: flex;
		gap: 20px;
		align-items: center;
		margin-left: auto;
	}

	.news-container {
		max-width: 1100px;
		margin: 30px auto;
		padding: 0 20px;
		display: grid;
		grid-template-columns: 2fr 1fr;
		gap: 40px;
	}

	.main-article {
		border-right: 1px solid #e2e2e2;
		padding-right: 30px;
	}

	.main-article img {
		width: 100%;
		height: auto;
		border-radius: 6px;
		margin-bottom: 15px;
	}

	.main-article h2 {
		font-size: 32px;
		line-height: 1.2;
		margin: 10px 0;
	}

	.main-article .kicker {
		font-family: sans-serif;
		font-size: 12px;
		font-weight: bold;
		text-transform: uppercase;
		color: #888;
		letter-spacing: 1px;
	}

	.main-article p {
		font-size: 18px;
		line-height: 1.6;
		color: #333;
	}

	.sidebar {
		display: flex;
		flex-direction: column;
		gap: 20px;
	}

	.sidebar-item {
		border-bottom: 1px solid #e2e2e2;
		padding-bottom: 15px;
	}

	.sidebar-item h3 {
		font-size: 20px;
		margin: 5px 0;
	}

	.sidebar-item p {
		font-size: 14px;
		line-height: 1.4;
		color: #555;
	}
